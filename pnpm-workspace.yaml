packages:
  - apps/*
  - infra/*
  - oxlint-plugin-t3code
  - packages/*
  - scripts

# Successor to onlyBuiltDependencies/ignoredBuiltDependencies (pnpm 11).
# true = allowed to run build scripts; false mirrors the pnpm 10 behavior
# where anything outside onlyBuiltDependencies was silently not built.
allowBuilds:
  browser-tabs-lock: false
  bufferutil: false
  core-js: false
  electron: true
  electron-winstaller: false
  esbuild: true
  msw: false
  node-pty: true
  sharp: true
  utf-8-validate: false
  workerd: false

catalog:
  "@clerk/backend": 3.18.1
  "@clerk/clerk-js": 6.32.1
  "@clerk/electron": 0.0.44
  "@clerk/electron-passkeys": 0.0.3
  "@clerk/react": 6.16.1
  "@clerk/shared": 4.33.0
  "@effect/atom-react": 4.0.0-rc.115
  "@effect/openapi-generator": 4.0.0-rc.115
  "@effect/platform-node": 4.0.0-rc.115
  "@effect/platform-node-shared": 4.0.0-rc.115
  "@effect/sql-pg": 4.0.0-rc.115
  "@effect/tsgo": 0.41.0
  "@effect/vitest": 4.0.0-rc.115
  "@legendapp/list": 3.3.5
  "@noble/curves": 1.9.1
  "@noble/hashes": 1.8.0
  "@pierre/diffs": 1.3.0-beta.10
  "@tailwindcss/node": 4.3.3
  "@tailwindcss/oxide": 4.3.3
  "@tailwindcss/vite": 4.3.3
  "@types/node": 24.12.4
  effect: 4.0.0-rc.115
  jose: 6.2.2
  lightningcss: 1.33.0
  tailwindcss: 4.3.3
  typescript: 7.0.2
  viem: 2.55.11
  vite: npm:@voidzero-dev/vite-plus-core@0.3.3
  vite-plus: 0.3.3
  yaml: ^2.9.0

minimumReleaseAgeExclude:
  - "@clerk/backend@3.18.1"
  - "@clerk/clerk-js@6.32.1"
  - "@clerk/electron@0.0.44"
  - "@clerk/react@6.16.1"
  - "@clerk/shared@4.33.0"
  - "@distilled.cloud/aws@1.0.0-rc.12"
  - "@distilled.cloud/axiom@1.0.0-rc.12"
  - "@distilled.cloud/cloudflare@1.0.0-rc.12"
  - "@distilled.cloud/core@1.0.0-rc.12"
  - "@distilled.cloud/neon@1.0.0-rc.12"
  - "@distilled.cloud/planetscale@1.0.0-rc.12"
  - "@effect/atom-react@4.0.0-rc.115"
  - "@effect/openapi-generator@4.0.0-rc.115"
  - "@effect/platform-node-shared@4.0.0-rc.115"
  - "@effect/platform-node@4.0.0-rc.115"
  - "@effect/sql-pg@4.0.0-rc.115"
  - "@effect/vitest@4.0.0-rc.115"
  - alchemy@2.0.0-beta.79
  - effect@4.0.0-rc.115
  - "@legendapp/list@3.3.5"
  - electron@44.4.2
  - "@anthropic-ai/claude-agent-sdk@0.3.276"
  - "@alchemy.run/cloudflare-runtime@2.0.0-beta.79"
  - "@alchemy.run/floci@2.0.0-beta.79"
  - "@alchemy.run/node-utils@2.0.0-beta.79"
  - "@distilled.cloud/fly-io@1.0.0-rc.12"
  - "@distilled.cloud/hetzner@1.0.0-rc.12"
  - "@distilled.cloud/prisma@1.0.0-rc.12"
  - "@distilled.cloud/railway@1.0.0-rc.12"
  - "@distilled.cloud/stripe@1.0.0-rc.12"
  - "@shadcn/lint@0.1.5"
  - cn@0.3.2

overrides:
  # Earlier React Navigation declarations create a circular type alias in TypeScript 7.
  "@react-navigation/core": 7.21.13
  # The dbus-next patch drops usocket from the package, but pnpm resolves from the
  # registry manifest, so the edge has to be cut here as well.
  "dbus-next>usocket": "-"
  # The SDK always receives the user's Claude executable, so its bundled binaries are unused.
  "@anthropic-ai/claude-agent-sdk>@anthropic-ai/claude-agent-sdk-darwin-arm64": "-"
  "@anthropic-ai/claude-agent-sdk>@anthropic-ai/claude-agent-sdk-darwin-x64": "-"
  "@anthropic-ai/claude-agent-sdk>@anthropic-ai/claude-agent-sdk-linux-arm64": "-"
  "@anthropic-ai/claude-agent-sdk>@anthropic-ai/claude-agent-sdk-linux-arm64-musl": "-"
  "@anthropic-ai/claude-agent-sdk>@anthropic-ai/claude-agent-sdk-linux-x64": "-"
  "@anthropic-ai/claude-agent-sdk>@anthropic-ai/claude-agent-sdk-linux-x64-musl": "-"
  "@anthropic-ai/claude-agent-sdk>@anthropic-ai/claude-agent-sdk-win32-arm64": "-"
  "@anthropic-ai/claude-agent-sdk>@anthropic-ai/claude-agent-sdk-win32-x64": "-"
  # Alchemy's Ink fork declares React as a hard dependency, but the relay only
  # reaches its terminal-capability helpers; the TUI is never imported, so the
  # extra React copy is pure install weight.
  "@alchemy.run/sigil>react": "-"
  "@alchemy.run/sigil>react-reconciler": "-"
  "@alchemy.run/sigil>scheduler": "-"
  # Alchemy only reaches @prisma/dev through a lazy import inside the Prisma
  # database provider, which the relay never deploys. Its exact hono/valibot
  # pins are also the bulk of our open dependency advisories.
  "alchemy>@prisma/dev": "-"
  "@clerk/backend": "catalog:"
  "@clerk/clerk-js": "catalog:"
  "@clerk/clerk-js>@base-org/account": "-"
  "@clerk/clerk-js>@coinbase/wallet-sdk": "-"
  "@clerk/clerk-js>@solana/wallet-adapter-base": "-"
  "@clerk/clerk-js>@solana/wallet-adapter-react": "-"
  "@clerk/clerk-js>@solana/wallet-standard": "-"
  "@clerk/clerk-js>@wallet-standard/core": "-"
  "@clerk/electron": "catalog:"
  "@clerk/electron-passkeys": "catalog:"
  "@clerk/react": "catalog:"
  "@clerk/shared": "catalog:"
  "@effect/atom-react": "catalog:"
  "@effect/platform-node": "catalog:"
  "@effect/platform-node-shared": "catalog:"
  "@effect/sql-pg": "catalog:"
  "@effect/vitest": "catalog:"
  "@effect/vitest>vitest": "-"
  "@pierre/diffs>@shikijs/transformers": ^4.2.0
  # Keep one copy of these native-binary packages. lightningcss ships 11 platform binaries per
  # version, and the workspaces' tailwindcss ^4 ranges drift into two 4.3.x copies of the family.
  "@tailwindcss/node": "catalog:"
  "@tailwindcss/oxide": "catalog:"
  "@tailwindcss/vite": "catalog:"
  "@types/node": "catalog:"
  effect: "catalog:"
  node-abi: 4.33.0
  lightningcss: "catalog:"
  tailwindcss: "catalog:"
  vite: "catalog:"
  yaml: "catalog:"

packageExtensions:
  "@effect/vitest@*":
    dependencies:
      vite-plus: "catalog:"
    peerDependenciesMeta:
      vitest:
        optional: true
  vite-plus@*:
    dependencies:
      vite: "catalog:"

patchedDependencies:
  "@effect/vitest@4.0.0-rc.115": patches/@effect__vitest@4.0.0-rc.115.patch
  "@ff-labs/fff-node@0.9.4": patches/@ff-labs__fff-node@0.9.4.patch
  "@legendapp/list@3.3.5": patches/@legendapp__list@3.3.5.patch
  "@pierre/diffs@1.3.0-beta.10": patches/@pierre%2Fdiffs@1.3.0-beta.10.patch
  dbus-next@0.10.2: patches/dbus-next@0.10.2.patch
  effect@4.0.0-rc.115: patches/effect@4.0.0-rc.115.patch

peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"
    # The official GraphiQL explorer wrapper supports this workspace's peers,
    # while its unchanged graphiql-explorer@0.9 manifest predates both versions.
    "graphiql-explorer>graphql": "16"
    "graphiql-explorer>react": "19"
    "graphiql-explorer>react-dom": "19"

supportedArchitectures:
  cpu: [current, x64]
  libc: [current, glibc]
  os: [current, linux]
