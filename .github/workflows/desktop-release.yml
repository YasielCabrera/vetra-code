name: Desktop Release

on:
  workflow_dispatch:

permissions:
  contents: read

# Each run claims the next version, so a second run waits for the first to
# publish instead of resolving the same number.
concurrency:
  group: desktop-release
  cancel-in-progress: false

jobs:
  preflight:
    name: Resolve version
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      # Every run publishes a real release, so only the default branch cuts one.
      - name: Require the default branch
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [[ "$GITHUB_REF" != "refs/heads/$DEFAULT_BRANCH" ]]; then
            echo "::error::Desktop releases are cut from $DEFAULT_BRANCH; this run selected $GITHUB_REF_NAME."
            exit 1
          fi

      # This repository is public, so Git needs no credentials. checkout's
      # credential cleanup runs submodule foreach even with submodules disabled,
      # which fails on the orphaned gitlinks in our vendored .repos tree.
      - name: Checkout
        env:
          GIT_TERMINAL_PROMPT: "0"
        run: |
          set -euo pipefail
          git init --quiet .
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags --depth=1 origin "$GITHUB_SHA"
          git sparse-checkout set --no-cone '/.github/scripts/'
          git checkout --detach FETCH_HEAD

      - name: Test release versioning
        run: node --test .github/scripts/next-release-version.test.cjs

      - id: version
        name: Resolve next version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          version="$(gh release list --repo "$GITHUB_REPOSITORY" --limit 1000 --json tagName,isDraft \
            | node .github/scripts/next-release-version.cjs)"
          echo "Releasing v$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # Installed macOS apps only accept updates signed by the same Developer
      # ID, so an unsigned build must never reach the update feed. This reads
      # only whether each credential is set, never its value.
      - name: Require macOS signing credentials
        env:
          HAS_CSC_LINK: ${{ secrets.CSC_LINK != '' }}
          HAS_CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD != '' }}
          HAS_APPLE_API_KEY: ${{ secrets.APPLE_API_KEY != '' }}
          HAS_APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID != '' }}
          HAS_APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER != '' }}
          HAS_APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID != '' }}
        run: |
          missing=()
          for name in CSC_LINK CSC_KEY_PASSWORD APPLE_API_KEY APPLE_API_KEY_ID APPLE_API_ISSUER APPLE_TEAM_ID; do
            has="HAS_$name"
            [[ "${!has}" == "true" ]] || missing+=("$name")
          done
          if (( ${#missing[@]} > 0 )); then
            echo "::error::macOS releases are signed and notarized. Missing: ${missing[*]}. See docs/operations/release.md."
            exit 1
          fi

  build:
    name: Build ${{ matrix.label }}
    needs: preflight
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS arm64
            runner: macos-15
            platform: mac
            target: dmg
            arch: arm64
            rust_target: aarch64-apple-darwin
            # Squirrel.Mac installs updates from the zip, not the DMG.
            assets: "*.dmg *.zip *.zip.blockmap latest-mac.yml"
          - label: Linux x64
            runner: ubuntu-24.04
            platform: linux
            target: AppImage
            arch: x64
            rust_target: x86_64-unknown-linux-gnu
            # latest-linux.yml lists both packages; the AppImage embeds its blockmap.
            assets: "*.AppImage *.deb latest-linux.yml"
          - label: Windows x64
            runner: windows-2025
            platform: win
            target: nsis
            arch: x64
            rust_target: x86_64-pc-windows-msvc
            assets: "*.exe *.exe.blockmap latest.yml"
    steps:
      - name: Checkout
        shell: bash
        env:
          GIT_TERMINAL_PROMPT: "0"
        run: |
          set -euo pipefail
          git init --quiet .
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags --depth=1 origin "$GITHUB_SHA"
          git sparse-checkout set --no-cone '/*' '!/.repos/'
          git -c checkout.workers=0 checkout --detach FETCH_HEAD

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: false

      - name: Install desktop dependencies
        run: vp install --filter=@t3tools/desktop... --filter=t3... --filter=@t3tools/scripts...

      - name: Cache resource monitor
        id: resource_monitor_cache
        uses: actions/cache@v6
        with:
          path: native/resource-monitor/target/${{ matrix.rust_target }}/release/t3-resource-monitor${{ matrix.platform == 'win' && '.exe' || '' }}
          key: resource-monitor-${{ matrix.rust_target }}-${{ hashFiles('native/resource-monitor/Cargo.lock', 'native/resource-monitor/Cargo.toml', 'native/resource-monitor/src/**') }}

      - name: Cache Linux capture helpers
        if: matrix.platform == 'linux'
        id: capture_helper_cache
        uses: actions/cache@v6
        with:
          path: |
            native/kde-snap-shot/target/${{ matrix.rust_target }}/release/t3-kde-snap-shot
            native/hyprland-snap-shot/target/${{ matrix.rust_target }}/release/t3-hyprland-snap-shot
          key: linux-capture-helpers-${{ matrix.rust_target }}-${{ hashFiles('native/kde-snap-shot/Cargo.lock', 'native/kde-snap-shot/Cargo.toml', 'native/kde-snap-shot/src/**', 'native/hyprland-snap-shot/Cargo.lock', 'native/hyprland-snap-shot/Cargo.toml', 'native/hyprland-snap-shot/src/**', 'native/hyprland-snap-shot/protocols/**') }}

      - name: Setup Rust
        if: steps.resource_monitor_cache.outputs.cache-hit != 'true' || (matrix.platform == 'linux' && steps.capture_helper_cache.outputs.cache-hit != 'true')
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      # Only the resource monitor build needs these libraries, so a cached
      # monitor skips the install along with the desktop build's MSVC check.
      - name: Install Spectre-mitigated MSVC libs
        if: matrix.platform == 'win' && steps.resource_monitor_cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $installPath = & $vswhere -products * -latest -property installationPath
          $setupExe = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\setup.exe"
          $proc = Start-Process -FilePath $setupExe `
            -ArgumentList "modify", "--installPath", "`"$installPath`"", "--add", `
            "Microsoft.VisualStudio.Component.VC.Runtimes.x86.x64.Spectre", "--quiet", "--norestart" `
            -Wait -PassThru -NoNewWindow
          if ($null -eq $proc -or $proc.ExitCode -ne 0) {
            $code = if ($null -ne $proc) { $proc.ExitCode } else { 1 }
            Write-Error "Visual Studio Installer failed with exit code $code"
            exit $code
          }

      - name: Install Linux desktop build libraries
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libsecret-1-dev pkg-config imagemagick

      # Only macOS is signed (and notarized); Windows and Linux ship unsigned,
      # and only the macOS job receives Apple credentials.
      - name: Build installer
        shell: bash
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
          VETRA_DESKTOP_UPDATE_REPOSITORY: ${{ github.repository }}
          VETRA_DESKTOP_REUSE_RESOURCE_MONITOR: ${{ steps.resource_monitor_cache.outputs.cache-hit == 'true' }}
          VETRA_DESKTOP_REUSE_LINUX_CAPTURE_HELPERS: ${{ steps.capture_helper_cache.outputs.cache-hit == 'true' }}
          CSC_LINK: ${{ matrix.platform == 'mac' && secrets.CSC_LINK || '' }}
          CSC_KEY_PASSWORD: ${{ matrix.platform == 'mac' && secrets.CSC_KEY_PASSWORD || '' }}
          APPLE_API_KEY: ${{ matrix.platform == 'mac' && secrets.APPLE_API_KEY || '' }}
          APPLE_API_KEY_ID: ${{ matrix.platform == 'mac' && secrets.APPLE_API_KEY_ID || '' }}
          APPLE_API_ISSUER: ${{ matrix.platform == 'mac' && secrets.APPLE_API_ISSUER || '' }}
        run: |
          set -euo pipefail

          node scripts/update-release-package-versions.ts "$VERSION"
          cp .env.example .env

          args=(
            --platform ${{ matrix.platform }}
            --target ${{ matrix.target }}
            --arch ${{ matrix.arch }}
            --build-version "$VERSION"
            --verbose
          )
          if [[ "${{ matrix.platform }}" == "mac" ]]; then
            # Notarization reads the App Store Connect key from a file.
            key_path="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"
            printf '%s' "$APPLE_API_KEY" > "$key_path"
            export APPLE_API_KEY="$key_path"
            args+=(--signed)
          fi

          vp run dist:desktop:artifact "${args[@]}"

      # release/ also holds the DMG blockmap and builder logs. Publish each
      # installer and what electron-updater reads, and nothing else. Asset
      # names differ by extension and manifest name across platforms.
      - name: Collect release assets
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          mkdir release-assets
          read -ra patterns <<< "${{ matrix.assets }}"
          for pattern in "${patterns[@]}"; do
            # shellcheck disable=SC2206 # the pattern is meant to glob
            matches=(release/$pattern)
            # nullglob drops an unmatched glob but keeps a missing literal name.
            [[ -e "${matches[0]:-}" ]] || matches=()
            if (( ${#matches[@]} != 1 )); then
              printf 'Expected one release/%s, found %s.\n' "$pattern" "${#matches[@]}" >&2
              exit 1
            fi
            cp "${matches[0]}" release-assets/
          done

      # electron-builder only warns when it finds no signing identity or no
      # notarization credentials. Check the app inside the zip, which is what
      # updates install; the DMG is built from the same signed app.
      - name: Verify macOS signature and notarization
        if: matrix.platform == 'mac'
        env:
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          ditto -x -k release-assets/*.zip "$RUNNER_TEMP/verify"
          app=("$RUNNER_TEMP"/verify/*.app)
          codesign --verify --deep --strict --verbose=2 "${app[0]}"
          xcrun stapler validate "${app[0]}"
          team="$(codesign --display --verbose=2 "${app[0]}" 2>&1 | sed -n 's/^TeamIdentifier=//p')"
          if [[ "$team" != "$APPLE_TEAM_ID" ]]; then
            echo "::error::The app is signed by team '$team', not APPLE_TEAM_ID '$APPLE_TEAM_ID'."
            exit 1
          fi

      - name: Upload release assets
        uses: actions/upload-artifact@v7
        with:
          name: desktop-${{ matrix.platform }}
          path: release-assets/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  # The only job with a write token. It never checks out the repository; it
  # only publishes what the build jobs produced, and runs only after every
  # build succeeded, so a failed run claims no version.
  publish:
    name: Publish release
    needs: [preflight, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download release assets
        uses: actions/download-artifact@v8
        with:
          pattern: desktop-*
          merge-multiple: true
          path: release

      # The tag targets the commit that was built, not wherever the branch
      # moved during the build.
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          set -euo pipefail

          gh release create "v$VERSION" release/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Vetra Code v$VERSION" \
            --generate-notes
